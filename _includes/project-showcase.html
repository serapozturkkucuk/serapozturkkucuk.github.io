{% if include.src %}
<figure class="shot">
  <a class="shot-link" href="{{ include.src | relative_url }}" target="_blank" rel="noopener noreferrer" aria-label="View Full-Size Screenshot: {{ include.alt | escape }}">
    <img src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}" width="{{ include.width }}" height="{{ include.height }}" loading="{{ include.loading | default: 'lazy' }}" decoding="async">
  </a>
  {% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>
{% endif %}
