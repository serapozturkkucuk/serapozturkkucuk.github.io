<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.author.name }}</title>
<meta name="description" content="{% if page.summary %}{{ page.summary | strip_html | escape }}{% else %}{{ site.description | escape }}{% endif %}">
<meta name="theme-color" content="#F8F7F4">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=4">
</head>
<body>
{% include nav.html %}
<main class="wrap">
{{ content }}
</main>
{% include footer.html %}
</body>
</html>
