name: Optimise portfolio screenshots (one-time)
on:
  push:
    branches:
      - optimise-web-images-2026

permissions:
  contents: write

jobs:
  optimise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Convert original images to WebP and rewrite site references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          images = Path("assets/img/harbourline")
          sizes = []
          for src in sorted(images.glob("*.png")):
              dst = src.with_suffix(".webp")
              with Image.open(src) as im:
                  im.save(dst, "WEBP", quality=82, method=6)
              sizes.append((src.stat().st_size, dst.stat().st_size))
          for suffix in ("*.html", "*.md", "*.yml"):
              for path in Path(".").rglob(suffix):
                  if ".git" in path.parts or "_site" in path.parts:
                      continue
                  old = path.read_text(encoding="utf-8")
                  new = re.sub(r"(/assets/img/harbourline/[A-Za-z0-9_-]+)\\.png", r"\\1.webp", old)
                  if old != new:
                      path.write_text(new, encoding="utf-8")
          before = sum(x for x, y in sizes)
          after = sum(y for x, y in sizes)
          print(f"{len(sizes)} screenshots: {before:,} -> {after:,} bytes ({(1-after/before)*100:.1f}% smaller)")
          assert len(sizes) >= 8 and after < before * 0.6
          PY
      - name: Commit optimised assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/harbourline/ *.html _projects _layouts _includes docs about projects index.html || true
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Use smaller WebP screenshots throughout portfolio"
            git push
          fi
