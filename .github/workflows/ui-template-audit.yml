name: UI template audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ui-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1
          which google-chrome || which google-chrome-stable || which chromium || which chromium-browser
      - name: Check responsive pages, images and navigation
        shell: bash
        run: |
          python3 -m http.server 8765 --directory _site >/tmp/ui-server.log 2>&1 &
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,channel:'chrome',args:['--no-sandbox']});
            const pages=['/','/projects/','/experience/','/certifications/','/contact/','/projects/harbourline/'];
            const sizes=[375,768,1024,1280,1440];
            let failures=[];
            for(const width of sizes)for(const route of pages){
              const page=await b.newPage({viewport:{width,height:850}});
              const result=await page.goto('http://127.0.0.1:8765'+route,{waitUntil:'networkidle'});
              await page.evaluate(async()=>{ const imgs=[...document.images]; imgs.forEach(img=>{img.dataset.originalLoading=img.getAttribute('loading')||'';img.loading='eager'}); await Promise.all(imgs.map(img=>img.decode().catch(()=>{}))); });
              const info=await page.evaluate(()=>({
                scrollWidth:document.documentElement.scrollWidth,
                bodyWidth:document.body.scrollWidth,
                title:document.title,
                headings:[...document.querySelectorAll('h1')].map(x=>x.textContent.trim()),
                failedImages:[...document.images].filter(x=>!x.complete || x.naturalWidth===0).map(x=>x.src),
                menuVisible:getComputedStyle(document.querySelector('.mobile-menu')).display!=='none',
                desktopNavVisible:getComputedStyle(document.querySelector('.desktop-nav')).display!=='none'
              }));
              console.log(JSON.stringify({route,width,status:result.status(),...info}));
              const geometry=await page.evaluate(()=>{
                const main=document.querySelector('main.wrap');
                const mr=main.getBoundingClientRect(),ms=getComputedStyle(main);
                const left=mr.left+parseFloat(ms.paddingLeft),right=mr.right-parseFloat(ms.paddingRight);
                const nodes=[
                  ...main.querySelectorAll(':scope > header, :scope > section, :scope > div, :scope > p.crumb'),
                  ...main.querySelectorAll('.project-brief, .project-stats, .block > .experience-value, .block > .experience-project, .block > .experience-skills, .block > .experience-detail-row, .block > .jobs, .block > .badges, .block > .contact-list, .block > .home-skill-grid, .case > .stats, .case > .solution-list, .case > .test-grid, .case > .case-decision, .case > figure.shot, .case > .case-next-step, .case > h2')
                ];
                const issues=nodes.filter(x=>getComputedStyle(x).display!=='none').map(x=>{
                  const r=x.getBoundingClientRect();
                  return {element:x.tagName.toLowerCase()+'.'+x.className,left:Math.round(r.left-left),right:Math.round(right-r.right)};
                }).filter(x=>Math.abs(x.left)>2||Math.abs(x.right)>2);
                const wrappers=[document.querySelector('.site-head .wrap'),document.querySelector('.site-foot .wrap')].map(x=>{
                  const r=x.getBoundingClientRect(),cs=getComputedStyle(x);
                  return {left:r.left+parseFloat(cs.paddingLeft),right:r.right-parseFloat(cs.paddingRight)};
                });
                const wrappersMatch=wrappers.every(x=>Math.abs(x.left-left)<2&&Math.abs(x.right-right)<2);
                const textNodes=[...main.querySelectorAll('p')];
                const proseIssues=textNodes.map(x=>{
                  const r=x.getBoundingClientRect(),parent=x.parentElement.getBoundingClientRect(),cs=getComputedStyle(x),pcs=getComputedStyle(x.parentElement);
                  const innerLeft=parent.left+parseFloat(pcs.paddingLeft)+parseFloat(pcs.borderLeftWidth);
                  const innerRight=parent.right-parseFloat(pcs.paddingRight)-parseFloat(pcs.borderRightWidth);
                  return {element:x.className||x.parentElement.className,left:Math.round(r.left-innerLeft),right:Math.round(innerRight-r.right),maxWidth:cs.maxWidth,align:cs.textAlign};
                }).filter(x=>Math.abs(x.left)>2||Math.abs(x.right)>2||x.maxWidth!=='none'||x.align!=='left');
                return {left:Math.round(left),right:Math.round(right),issues,wrappersMatch,proseIssues};
              });
              if(geometry.issues.length)failures.push(route+' '+width+' misaligned: '+JSON.stringify(geometry.issues));
              if(!geometry.wrappersMatch)failures.push(route+' '+width+' header/footer container mismatch');
              if(geometry.proseIssues.length)failures.push(route+' '+width+' text misalignment: '+JSON.stringify(geometry.proseIssues));
              if(route==='/projects/harbourline/'){
                const project=await page.evaluate(()=>{
                  const main=document.querySelector('main.wrap');
                  const brief=main.querySelector('.project-brief');
                  const stats=main.querySelector('.project-stats');
                  const grid=main.querySelector('.case-grid');
                  const sidebar=grid?.querySelector('.facts-box');
                  const caseBody=grid?.querySelector('.case');
                  const sections=[...caseBody.querySelectorAll(':scope > .project-chapter')];
                  const toc=[...sidebar.querySelectorAll('.toc a')];
                  const shots=[...caseBody.querySelectorAll('figure.shot img')];
                  const topActions=[...sidebar.querySelectorAll('.project-document-actions a')].map(a=>({label:a.textContent.trim(),href:a.getAttribute('href'),class:a.className}));
                  const bottomActions=[...main.querySelectorAll('.project-bottom-actions a')].map(a=>({label:a.textContent.trim(),href:a.getAttribute('href'),class:a.className}));
                  const expected=['01 The Business Challenge','02 The Solution','03 Design Decisions','04 Testing & Troubleshooting','05 Results, Limitations & Next Steps'];
                  const headers=sections.map(x=>x.querySelector(':scope > h2')?.textContent.trim());
                  const sectionShotCounts=sections.map(x=>x.querySelectorAll('figure.shot img').length);
                  const sideStyle=getComputedStyle(sidebar);
                  const box=sidebar.getBoundingClientRect();
                  const projectLeft=grid.getBoundingClientRect().left,projectRight=grid.getBoundingClientRect().right;
                  return {
                    inOrder:!!brief&&!!stats&&!!grid&&!!(brief.compareDocumentPosition(stats)&Node.DOCUMENT_POSITION_FOLLOWING)&&!!(stats.compareDocumentPosition(grid)&Node.DOCUMENT_POSITION_FOLLOWING),
                    headingsCorrect:JSON.stringify(headers)===JSON.stringify(expected),
                    tocCorrect:toc.length===5&&toc.every((a,i)=>a.textContent.trim()===expected[i]&&a.getAttribute('href')==='#'+sections[i]?.querySelector('h2')?.id),
                    shotCounts:sectionShotCounts,
                    shotsOK:shots.length===6&&shots.every((img,i)=>img.src.endsWith('.webp')&&+img.getAttribute('width')>0&&+img.getAttribute('height')>0&&img.closest('a')?.href===img.src&&(i===0?img.dataset.originalLoading!=='lazy':img.dataset.originalLoading==='lazy')),
                    actionsOK:topActions.length===2&&JSON.stringify(topActions)===JSON.stringify(bottomActions)&&topActions[0].label==='Technical Documentation'&&topActions[1].label==='Download PDF',
                    sidebarDesktop:innerWidth>1000?sideStyle.position==='sticky'&&Math.abs(box.width-280)<3&&box.height<=innerHeight-20:sideStyle.position!=='sticky',
                    gridOK:innerWidth>1000?Math.abs(projectRight-caseBody.getBoundingClientRect().right)<2&&Math.abs(projectLeft-sidebar.getBoundingClientRect().left)<2:Math.abs(projectLeft-sidebar.getBoundingClientRect().left)<2
                  };
                });
                if(!project.inOrder||!project.headingsCorrect||!project.tocCorrect||!project.shotsOK||!project.actionsOK||!project.sidebarDesktop||!project.gridOK||project.shotCounts.join(',')!=='0,3,2,0,1')
                  failures.push(route+' '+width+' project layout or content mismatch '+JSON.stringify(project));
              }
              if(route==='/experience/'){
                const editorial=await page.evaluate(()=>{
                  const titles=[...document.querySelectorAll('main.wrap h2')].map(h=>h.textContent.trim());
                  const jobs=[...document.querySelectorAll('.experience-jobs > li')].length;
                  const skills=[...document.querySelectorAll('.experience-skills dt')].length;
                  return {titles,jobs,skills};
                });
                const expected=['Career Background','Salesforce Experience','Salesforce Skills','What I Bring','Professional Experience','Technology & Tools','Education','Languages','Additional Details','Full CV'];
                if(editorial.titles.join('|')!==expected.join('|')||editorial.jobs!==2||editorial.skills<5)
                  failures.push(route+' '+width+' Experience page section order or evidence missing '+JSON.stringify(editorial));
              }
              const copy=await page.locator('main.wrap').innerText();
              if(copy.includes('£')||copy.includes('—')||copy.includes('CMS systems'))
                failures.push(route+' '+width+' unexpected public copy: money, em dash or CMS systems');
              if(/\b(?:I|my|mine|me|Serap['’]s)\b/i.test(copy.replace('What I Bring','')))
                failures.push(route+' '+width+' first-person or possessive pronoun remains');
              if(route==='/experience/'){
                const details=await page.evaluate(()=>({
                  cvButtons:[...document.querySelectorAll('a')].filter(a=>a.textContent.trim()==='Download CV').length,
                  schemaImage:document.querySelector('.experience-project-image img')?.getAttribute('src'),
                  employerNames:[...document.querySelectorAll('.experience-jobs .when b')].map(e=>e.textContent.trim()),
                  rows:[...document.querySelectorAll('.experience-skills dt')].map(e=>e.textContent.trim())
                }));
                if(details.cvButtons!==2||!details.schemaImage?.includes('schema.webp')||
                   details.employerNames.join('|')!=='Puratos UK|Doktar Technologies'||
                   !details.rows.includes('Platform Configuration')||!details.rows.includes('Automation'))
                  failures.push(route+' '+width+' content structure mismatch '+JSON.stringify(details));
              }
              if(route==='/contact/'){
                const count=await page.locator('.contact-link-card').count();
                if(count!==4)failures.push(route+' '+width+' expected 4 contact cards, found '+count);
              }
              if(route==='/'){
                const a=await page.locator('.home-skill-grid li').nth(1).innerText();
                const b=await page.locator('#open-roles-heading').innerText();
                if(!a.includes('schedule-triggered flows')||b!=='Open to New Roles')
                  failures.push(route+' '+width+' home content mismatch');
              }
              if(result.status()!==200) failures.push(route+' '+width+' HTTP '+result.status());
              if(info.scrollWidth>width+2) failures.push(route+' '+width+' horizontal overflow '+info.scrollWidth);
              if(info.failedImages.length) failures.push(route+' '+width+' broken image '+info.failedImages.join(','));
              if(info.headings.length!==1) failures.push(route+' '+width+' h1 count '+info.headings.length);
              if(width<=768 && !info.menuVisible) failures.push(route+' '+width+' mobile menu missing');
              if(width>768 && !info.desktopNavVisible) failures.push(route+' '+width+' desktop nav missing');
              if(route==='/' && width===375){
                await page.locator('.mobile-menu summary').click();
                const visible=await page.locator('.mobile-menu nav a').first().isVisible();
                if(!visible) failures.push('mobile menu cannot be opened');
              }
              await page.close();
            }
            const old=await b.newPage();
            await old.goto('http://127.0.0.1:8765/about/',{waitUntil:'domcontentloaded'});
            try{
              await old.waitForURL('**/experience/',{timeout:12000});
              console.log('Legacy /about/ correctly redirects to /experience/');
            }catch(e){failures.push('Legacy /about/ does not redirect to /experience/ ('+old.url()+')')}
            await old.close();
            const docs=await b.newPage();
            const docResult=await docs.goto('http://127.0.0.1:8765/docs/harbourline/',{waitUntil:'domcontentloaded'});
            if(docResult?.status()!==200)failures.push('Technical documentation did not load');
            const textDoc=await docs.locator('body').innerText();
            if(textDoc.includes('£')||textDoc.includes('—')||textDoc.includes('CMS systems'))
              failures.push('Technical documentation contains a money figure, em dash or CMS systems');
            await docs.close();
            await b.close();
            if(failures.length){console.error('AUDIT FAILED:',failures.join(' | '));process.exit(1)}
            console.log('UI AUDIT PASSED: 30 pages/viewports, precise left/right alignment, full-width text bounds, images, nav, h1 and overflow');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
